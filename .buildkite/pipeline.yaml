env:
  GO_VERSION: "1.26"
  AWS_REGION: "ap-southeast-1"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  ENVIRONMENT_NAME: "prod"

steps:
  - label: ":golang: lint"
    key: "lint"
    command: "make lint"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - label: ":openapi: swagger validation"
    key: "swagger-validate"
    command: "go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest && make swagger-validate"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - label: ":openapi: generation check"
    key: "generate-check"
    command: "go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest && make generate-check"
    depends_on: "swagger-validate"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - label: ":test_tube: tests"
    key: "test"
    command: "make test"
    depends_on: "lint"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - label: ":bar_chart: coverage"
    key: "coverage"
    command: "make coverage"
    depends_on: "test"
    artifact_paths:
      - "coverage.out"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - label: ":hammer: build"
    key: "build"
    command: "make build"
    depends_on:
      - "generate-check"
      - "test"
    artifact_paths:
      - "bin/*"
    plugins:
      - docker#v5.13.0:
          image: "golang:${GO_VERSION}"
          workdir: /workdir
          volumes:
            - ".:/workdir"

  - wait

  - label: ":docker: docker build"
    key: "docker-build"
    command: "make docker-build"
    depends_on: "build"

  - label: ":rocket: deploy production"
    key: "deploy-production"
    command: |
      set -euo pipefail

      : "$${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set in Buildkite secrets}"
      : "$${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set in Buildkite secrets}"
      : "$${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID must be set in Buildkite environment/secrets}"
      : "$${VPC_ID:?VPC_ID must be set in Buildkite environment/secrets}"
      : "$${PUBLIC_SUBNET_IDS:?PUBLIC_SUBNET_IDS must be set in Buildkite environment/secrets}"

      aws sts get-caller-identity
      make deploy-production
    depends_on: "docker-build"
    branches: "main"
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_ACCOUNT_ID
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - VPC_ID
      - PUBLIC_SUBNET_IDS
